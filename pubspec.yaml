name: flutter_amap_position
description: Flutter plugin for one-shot and foreground location with the native AMap SDKs on Android, iOS and HarmonyOS NEXT.
version: 0.0.2
repository: https://github.com/lianshuoshuo/flutter_amap_position

environment:
  sdk: ^3.10.3
  flutter: '>=3.38.4'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.hscw.flutter_amap_position
        pluginClass: FlutterAmapPositionPlugin
      ios:
        pluginClass: FlutterAmapPositionPlugin
      ohos:
        pluginClass: FlutterAmapPositionPlugin
